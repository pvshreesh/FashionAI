<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .test { background: white; padding: 15px; margin: 10px 0; border-radius: 8px; }
        button { padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .result { margin-top: 10px; padding: 10px; background: #f0f0f0; border-radius: 5px; }
        .success { border-left: 4px solid green; }
        .error { border-left: 4px solid red; }
    </style>
</head>
<body>
    <h1>🧪 API Quick Test</h1>
    
    <div class="test">
        <h3>1. Health Check</h3>
        <button onclick="testHealth()">Test</button>
        <div id="health" class="result"></div>
    </div>

    <div class="test">
        <h3>2. AI Chat</h3>
        <input type="text" id="chatMsg" placeholder="Ask about fashion..." style="width: 300px; padding: 8px;">
        <button onclick="testChat()">Send</button>
        <div id="chat" class="result"></div>
    </div>

    <div class="test">
        <h3>3. Recommendations</h3>
        <button onclick="testRecommendations()">Get Recommendations</button>
        <div id="recs" class="result"></div>
    </div>

    <script>
        const API = 'http://localhost:3000';

        async function testHealth() {
            try {
                const res = await fetch(`${API}/health`);
                const data = await res.json();
                document.getElementById('health').innerHTML = `<pre class="success">✅ ${JSON.stringify(data, null, 2)}</pre>`;
            } catch (e) {
                document.getElementById('health').innerHTML = `<pre class="error">❌ ${e.message}<br>Make sure server is running: cd backend && npm run dev</pre>`;
            }
        }

        async function testChat() {
            const msg = document.getElementById('chatMsg').value || 'What colors work well together?';
            try {
                const res = await fetch(`${API}/api/ai/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                const data = await res.json();
                document.getElementById('chat').innerHTML = `<pre class="success">✅ ${data.message || data.error}</pre>`;
            } catch (e) {
                document.getElementById('chat').innerHTML = `<pre class="error">❌ ${e.message}</pre>`;
            }
        }

        async function testRecommendations() {
            try {
                const res = await fetch(`${API}/api/ai/recommendations`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        wardrobeItems: [
                            { name: 'Blue Jeans', tags: ['pants', 'casual'] },
                            { name: 'White T-Shirt', tags: ['tshirt', 'casual'] }
                        ],
                        occasion: 'date'
                    })
                });
                const data = await res.json();
                document.getElementById('recs').innerHTML = `<pre class="success">✅ ${JSON.stringify(data, null, 2)}</pre>`;
            } catch (e) {
                document.getElementById('recs').innerHTML = `<pre class="error">❌ ${e.message}</pre>`;
            }
        }

        // Auto-test on load
        window.onload = () => {
            setTimeout(testHealth, 1000);
        };
    </script>
</body>
</html>
